# Nombre del servidor
spring.application.name=baratito-server

# 1. Conexión a la base de datos
# Los valores después de ":" son defaults para cuando NO hay variable de entorno seteada
# (ej: si corrés el jar suelto sin Docker). Docker Compose y Render van a pisarlos.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/baratito_db?options=-c%20timezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres123}
spring.datasource.driver-className=org.postgresql.Driver

# 2. Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 3. Puerto del Backend
# Render inyecta la variable PORT automáticamente; en local usa 8080 como siempre
server.port=${PORT:8080}

# JWT config
jwt.secret=${JWT_SECRET:unaClaveSuperSecreta12345678901234567890}
jwt.expiration=${JWT_EXPIRATION:3600000}

# CORS: orígenes permitidos, separados por coma si son varios
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging.level.org.springframework.web=INFO