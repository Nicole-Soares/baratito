<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aa3bff" />
      <stop offset="100%" stop-color="#7c22d6" />
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5EEFF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Circle with Gradient -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <g filter="url(#shadow)" transform="translate(20, 10)">
    <!-- Shopping Cart Path -->
    <path d="M120 140 H160 L195 310 H375 L415 180 H200" 
          fill="none" 
          stroke="url(#cartGrad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Cart Basket Grid Lines -->
    <line x1="230" y1="230" x2="390" y2="230" stroke="url(#cartGrad)" stroke-width="20" stroke-linecap="round"/>
    <line x1="280" y1="180" x2="260" y2="310" stroke="url(#cartGrad)" stroke-width="20" stroke-linecap="round"/>
    <line x1="340" y1="180" x2="330" y2="310" stroke="url(#cartGrad)" stroke-width="20" stroke-linecap="round"/>

    <!-- Wheels -->
    <circle cx="215" cy="385" r="32" fill="#FFFFFF" />
    <circle cx="355" cy="385" r="32" fill="#FFFFFF" />
    <circle cx="215" cy="385" r="14" fill="#7c22d6" />
    <circle cx="355" cy="385" r="14" fill="#7c22d6" />

    <!-- Discount Tag / Spark -->
    <path d="M340 100 L390 100 L410 140 L360 140 Z" fill="#F59E0B" />
    <circle cx="360" cy="120" r="6" fill="#FFFFFF" />
  </g>
</svg>